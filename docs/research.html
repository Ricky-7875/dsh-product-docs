<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>用户调研纪要</title></head>
<body>
  <h1>用户调研纪要</h1>
  <p class="status">近三轮访谈</p>
  <h2>核心结论</h2>
  <ul>
    <li>用户更在意"少切换工具"，而不是"功能更多"。</li>
    <li>超过一半的受访者每天要手动整理同一份数据的多个版本。</li>
    <li>对"自动执行"的信任门槛，主要卡在能否回滚。</li>
  </ul>
  <h2>待验证假设</h2>
  <p>如果提供"先预览再执行"，用户对自动化的接受度会明显提升。</p>
</body>
</html>
